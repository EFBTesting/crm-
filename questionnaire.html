<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client Questionnaire — Erwin Forest Builders</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23166232%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22%23ffffff%22 font-family=%22Georgia,serif%22 font-weight=%22bold%22>E</text></svg>">
  <link rel="stylesheet" href="assets/css/styles.css?v=59">
</head>
<body>

  <div class="questionnaire-page">
    <div class="questionnaire-card">
      <div class="brand brand--center">
        <img src="assets/img/logo-green.png?v=59" alt="Erwin Forest Builders" class="brand__logo">
      </div>

      <p id="q-loading" class="muted" style="text-align:center;">Loading...</p>
      <p id="q-error" class="login-error" hidden></p>

      <form id="q-form" class="form-grid" hidden>
        <h1 id="q-title" class="field--full"></h1>
        <p id="q-intro" class="view-sub field--full"></p>
        <div id="q-fields"></div>
        <div class="form-actions">
          <button type="submit" class="btn btn--primary btn--block">Submit</button>
        </div>
      </form>

      <div id="q-success" class="questionnaire-success" hidden>
        <h1>Thank you!</h1>
        <p class="view-sub">Your answers have been submitted — we'll be in touch soon.</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/js/config.js?v=59"></script>
  <script src="assets/js/questionnaire-questions.js?v=59"></script>
  <script src="assets/js/questionnaire.js?v=59"></script>
</body>
</html>
