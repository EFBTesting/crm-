<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get a Quote — Erwin Forrest Builders</title>
  <meta name="description" content="Tell us about your project and we'll be in touch.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23166232%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22%23ffffff%22 font-family=%22Georgia,serif%22 font-weight=%22bold%22>E</text></svg>">
  <link rel="stylesheet" href="assets/css/styles.css?v=99">
</head>
<body>

  <div class="qf-page">
    <div class="qf-sheet">
      <img src="assets/img/logo-green.png?v=99" alt="Erwin Forrest Builders" class="qf-logo">
      <h1 class="qf-sheet__title">Tell us about your project</h1>
      <hr class="qf-divider">
      <p class="qf-intro">Fill this out and someone from our team will reach out to schedule a conversation. No obligation — just a starting point.</p>
      <hr class="qf-divider">

      <p id="li-error" class="login-error" hidden></p>

      <form id="li-form" class="form-grid">
        <label class="field"><span>First name *</span>
          <input name="firstName" required placeholder="Jordan" autocomplete="given-name">
        </label>
        <label class="field"><span>Last name *</span>
          <input name="lastName" required placeholder="Blake" autocomplete="family-name">
        </label>
        <label class="field"><span>Phone</span>
          <input type="tel" name="phone" placeholder="(555) 555-0100" autocomplete="tel">
        </label>
        <label class="field"><span>Email</span>
          <input type="email" name="email" placeholder="jordan@email.com" autocomplete="email">
        </label>
        <label class="field"><span>Project type</span>
          <select name="projectType">
            <option value="">— Select one —</option>
            <option>Kitchen Remodel</option>
            <option>Bathroom Remodel</option>
            <option>Home Addition</option>
            <option>Whole-Home Renovation</option>
            <option>New Custom Home</option>
            <option>Other</option>
          </select>
        </label>
        <label class="field"><span>When do you want to start?</span>
          <select name="urgency">
            <option value="">— Select one —</option>
            <option>ASAP</option>
            <option>1-3 months</option>
            <option>3-6 months</option>
            <option>6-12 months</option>
            <option>Just exploring / no rush</option>
          </select>
        </label>
        <label class="field"><span>Best time to reach you</span>
          <select name="bestTime">
            <option value="">— No preference —</option>
            <option>Morning</option>
            <option>Evening</option>
            <option>Night</option>
            <option>Whenever</option>
          </select>
        </label>
        <label class="field field--full"><span>Property address</span>
          <input name="address" placeholder="Street, City, State" autocomplete="street-address">
        </label>
        <label class="field field--full"><span>Tell us about your project</span>
          <textarea name="notes" rows="4" placeholder="What are you looking to do?"></textarea>
        </label>

        <!-- Honeypot: hidden from real visitors via CSS, but a generically-named
             field bots tend to autofill. If it's non-empty on submit, we quietly
             pretend to succeed instead of writing anything. -->
        <label class="field field--full li-hp" aria-hidden="true"><span>Company</span>
          <input name="company" tabindex="-1" autocomplete="off">
        </label>

        <div class="form-actions">
          <button type="submit" class="btn btn--primary">Submit</button>
        </div>
      </form>

      <div id="li-success" hidden>
        <h2>Thank you!</h2>
        <p class="view-sub">We've got your info and will be in touch soon.</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/js/config.js?v=99"></script>
  <script src="assets/js/leadIntake.js?v=99"></script>
</body>
</html>
